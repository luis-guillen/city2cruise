name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-save
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Los commits de versión se firman con la autoría del repositorio: es un
          # proyecto de un solo autor y así el historial no introduce un contribuidor
          # sintético (github-actions[bot]) en la ficha del repositorio.
          GIT_AUTHOR_NAME: Luis Guillén Servera
          GIT_AUTHOR_EMAIL: luisgservsp@gmail.com
          GIT_COMMITTER_NAME: Luis Guillén Servera
          GIT_COMMITTER_EMAIL: luisgservsp@gmail.com
        run: npx semantic-release
