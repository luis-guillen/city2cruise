name: CD Frontend (Cloudflare Pages)

# NOTA: el proyecto de Cloudflare Pages se desmanteló tras la defensa del TFM y los
# secrets ya no existen. El workflow se conserva como referencia del despliegue del
# frontend, pero el disparo automático en cada push está desactivado: solo se ejecuta a
# mano y requiere reponer CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y VITE_SENTRY_DSN.

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & deploy frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: frontend-production
      url: https://city2cruise.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: cruise-connect-main/pnpm-lock.yaml
      - name: Install
        working-directory: ./cruise-connect-main
        run: pnpm install --frozen-lockfile
      - name: Build prod
        working-directory: ./cruise-connect-main
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://city2cruise.fly.dev/api' }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://city2cruise.fly.dev' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cruise-connect-main/dist --project-name=city2cruise --branch=main
